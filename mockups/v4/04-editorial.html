<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>04 Editorial wordmark - Yumma CSS v4 mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Esteban&family=IBM+Plex+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/mockup.css" />
    <style>
      :root {
        --body: "IBM Plex Mono", ui-monospace, monospace;
      }

      .page {
        position: relative;
        min-height: 100dvh;
        overflow: hidden;
        background:
          linear-gradient(
            165deg,
            #1a1d2e 0%,
            #151724 42%,
            #10121c 100%
          );
      }

      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.35;
        background-image: radial-gradient(
          rgba(190, 198, 242, 0.12) 0.6px,
          transparent 0.6px
        );
        background-size: 3px 3px;
        animation: soft-pulse 8s ease-in-out infinite;
        mask-image: radial-gradient(ellipse at 60% 40%, #000 20%, transparent 75%);
      }

      .anchor {
        position: absolute;
        left: 58%;
        bottom: -12%;
        width: min(70vw, 720px);
        aspect-ratio: 1;
        animation: drift 20s ease-in-out infinite, fade 1.3s var(--ease) both;
      }

      .anchor svg {
        width: 100%;
        height: 100%;
        opacity: 0.9;
      }

      .content {
        position: relative;
        z-index: 2;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: var(--max);
        width: 100%;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }

      .wordmark {
        margin: 0 0 36px;
        font-family: var(--display);
        font-size: clamp(3.5rem, 12vw, 9rem);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.03em;
        max-width: 12ch;
      }

      .wordmark em {
        font-style: normal;
        color: var(--accent);
      }

      .rule {
        width: 72px;
        height: 2px;
        margin-bottom: 28px;
        background: var(--indigo);
        transform-origin: left center;
        animation: rise 0.8s var(--ease) 0.15s both;
      }

      h1 {
        margin: 0 0 16px;
        font-family: var(--display);
        font-size: clamp(1.45rem, 2.8vw, 2rem);
        font-weight: 400;
        line-height: 1.25;
        max-width: 22rem;
      }

      .sub {
        margin: 0 0 32px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
        max-width: 26rem;
      }

      .cta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      @media (max-width: 800px) {
        .anchor {
          left: 20%;
          bottom: -20%;
          width: 110vw;
          opacity: 0.35;
        }
        .hero {
          justify-content: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <div class="mock-label">
      <strong>04</strong> Editorial wordmark
      <a href="./index.html">All mockups</a>
      <a href="./logos.html">Logos →</a>
    </div>

    <div class="page">
      <div class="grain" aria-hidden="true"></div>
      <div class="anchor" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="22" fill="#fff" />
          <path
            fill="#413cb8"
            d="M24 6c-9.94 0-18 8.06-18 18s8.06 18 18 18 18-8.06 18-18S33.94 6 24 6zm0 4c7.73 0 14 6.27 14 14s-6.27 14-14 14S10 31.73 10 24 16.27 10 24 10zm7.2 5.2c-.55 0-1.05.22-1.42.59L14.79 30.78c-.37.37-.59.87-.59 1.42 0 .6.28 1.18.76 1.55A13.9 13.9 0 0 0 24 36c3.7 0 7.05-1.44 9.55-3.79A13.9 13.9 0 0 0 38 24c0-3.4-1.22-6.52-3.24-8.95-.4-.5-.97-.85-1.56-.85z"
          />
        </svg>
      </div>

      <div class="content">
        <header class="nav">
          <a class="nav-brand" href="./index.html">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="22" fill="#fff" />
              <path
                fill="#413cb8"
                d="M24 6c-9.94 0-18 8.06-18 18s8.06 18 18 18 18-8.06 18-18S33.94 6 24 6zm0 4c7.73 0 14 6.27 14 14s-6.27 14-14 14S10 31.73 10 24 16.27 10 24 10zm7.2 5.2c-.55 0-1.05.22-1.42.59L14.79 30.78c-.37.37-.59.87-.59 1.42 0 .6.28 1.18.76 1.55A13.9 13.9 0 0 0 24 36c3.7 0 7.05-1.44 9.55-3.79A13.9 13.9 0 0 0 38 24c0-3.4-1.22-6.52-3.24-8.95-.4-.5-.97-.85-1.56-.85z"
              />
            </svg>
            <span>Yumma CSS</span>
          </a>
          <nav class="nav-links">
            <a href="#">Docs</a>
            <a href="#">Blog</a>
            <a href="#">Components</a>
            <a href="#">Playground</a>
          </nav>
          <div class="nav-actions">
            <a class="nav-ghost" href="#">GitHub</a>
          </div>
        </header>

        <main class="hero">
          <p class="wordmark rise-1">Yumma <em>CSS</em></p>
          <div class="rule" aria-hidden="true"></div>
          <h1 class="rise-2">Get faster at CSS while you use it.</h1>
          <p class="sub rise-3">
            Fixed scales for spacing, colors, type and radius. No arbitrary
            values to drift.
          </p>
          <div class="cta rise-4">
            <a class="btn btn-primary" href="#">Get started</a>
            <a class="btn btn-ghost" href="#">Try now</a>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
