<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>02 Mark as plane - Yumma CSS v4 mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Esteban&family=IBM+Plex+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/mockup.css" />
    <style>
      :root {
        --body: "IBM Plex Mono", ui-monospace, monospace;
      }

      .page {
        position: relative;
        min-height: 100dvh;
        overflow: hidden;
        background: var(--page);
      }

      .plane {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 70% 45%,
            rgba(65, 60, 184, 0.45) 0%,
            transparent 42%
          ),
          linear-gradient(
            180deg,
            #12141f 0%,
            var(--page) 45%,
            #10121c 100%
          );
      }

      .plane-mark {
        position: absolute;
        left: 52%;
        top: 50%;
        width: min(92vh, 820px);
        aspect-ratio: 1;
        transform: translate(-8%, -52%);
        animation: drift 18s ease-in-out infinite, fade 1.4s var(--ease) both;
      }

      .plane-mark svg {
        width: 100%;
        height: 100%;
      }

      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(21, 23, 36, 0.97) 0%,
          rgba(21, 23, 36, 0.82) 38%,
          rgba(21, 23, 36, 0.15) 70%,
          transparent 100%
        );
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }

      .hero {
        flex: 1;
        display: flex;
        align-items: center;
        max-width: var(--max);
        width: 100%;
        margin: 0 auto;
        padding: 40px 24px 72px;
      }

      .hero-copy {
        max-width: 34rem;
      }

      .brand {
        margin: 0 0 20px;
        font-family: var(--display);
        font-size: clamp(2.8rem, 7vw, 5.2rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .brand span {
        display: block;
        color: var(--accent);
        font-family: var(--body);
        font-size: 0.22em;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 18px;
        font-family: var(--display);
        font-size: clamp(1.6rem, 3.2vw, 2.35rem);
        font-weight: 400;
        line-height: 1.2;
        color: rgba(255, 255, 255, 0.92);
      }

      .sub {
        margin: 0 0 32px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
        max-width: 26rem;
      }

      .cta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      @media (max-width: 720px) {
        .plane-mark {
          left: 40%;
          width: 120vw;
          opacity: 0.45;
        }
        .veil {
          background: linear-gradient(
            180deg,
            rgba(21, 23, 36, 0.4) 0%,
            rgba(21, 23, 36, 0.92) 55%,
            var(--page) 100%
          );
        }
        .hero {
          align-items: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <div class="mock-label">
      <strong>02</strong> Mark as plane
      <a href="./index.html">All mockups</a>
      <a href="./03-blueprint.html">Next →</a>
    </div>

    <div class="page">
      <div class="plane" aria-hidden="true">
        <div class="plane-mark">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="#fff" />
            <path
              fill="#413cb8"
              fill-rule="evenodd"
              d="M24 8c8.84 0 16 7.16 16 16s-7.16 16-16 16S8 32.84 8 24 15.16 8 24 8zm0 5c6.08 0 11 4.92 11 11s-4.92 11-11 11S13 30.08 13 24s4.92-11 11-11zm0 5c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6 2.69-6 6-6zm0 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"
            />
          </svg>
        </div>
        <div class="veil"></div>
      </div>

      <div class="content">
        <header class="nav">
          <a class="nav-brand" href="./index.html">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="22" fill="#fff" />
              <path
                fill="#413cb8"
                fill-rule="evenodd"
                d="M24 8c8.84 0 16 7.16 16 16s-7.16 16-16 16S8 32.84 8 24 15.16 8 24 8zm0 5c6.08 0 11 4.92 11 11s-4.92 11-11 11S13 30.08 13 24s4.92-11 11-11zm0 5c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6 2.69-6 6-6zm0 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"
              />
            </svg>
            <span>Yumma CSS</span>
          </a>
          <nav class="nav-links">
            <a href="#">Docs</a>
            <a href="#">Blog</a>
            <a href="#">Components</a>
            <a href="#">Playground</a>
          </nav>
          <div class="nav-actions">
            <a class="nav-ghost" href="#">GitHub</a>
          </div>
        </header>

        <main class="hero">
          <div class="hero-copy">
            <p class="brand rise-1"><span>Utility CSS</span>Yumma CSS</p>
            <h1 class="rise-2">Get faster at CSS while you use it.</h1>
            <p class="sub rise-3">
              Fixed scales for spacing, colors, type and radius. No arbitrary
              values to drift.
            </p>
            <div class="cta rise-4">
              <a class="btn btn-primary" href="#">Get started</a>
              <a class="btn btn-ghost" href="#">Try now</a>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
