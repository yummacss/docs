<!-- Shared logo marks for v4 mockups. Each is original; none copy Notion's square / pac-circle / triangle trio. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- A: Chord  evolved from the current crescent; parallel chords = fixed scales -->
  <symbol id="logo-chord" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="22" fill="#fff"/>
    <path fill="#413cb8" d="M24 6c-9.94 0-18 8.06-18 18s8.06 18 18 18 18-8.06 18-18S33.94 6 24 6zm0 4c7.73 0 14 6.27 14 14s-6.27 14-14 14S10 31.73 10 24 16.27 10 24 10zm7.2 5.2c-.55 0-1.05.22-1.42.59L14.79 30.78c-.37.37-.59.87-.59 1.42 0 .6.28 1.18.76 1.55A13.9 13.9 0 0 0 24 36c3.7 0 7.05-1.44 9.55-3.79A13.9 13.9 0 0 0 38 24c0-3.4-1.22-6.52-3.24-8.95-.4-.5-.97-.85-1.56-.85z"/>
  </symbol>

  <!-- B: Offset  two discs offset; negative space forms a modern crescent without the old path -->
  <symbol id="logo-offset" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="22" fill="#fff"/>
    <circle cx="24" cy="24" r="14" fill="#413cb8"/>
    <circle cx="29.5" cy="18.5" r="9.5" fill="#fff"/>
  </symbol>

  <!-- C: Lattice  modular blocks with a continuous cut; geometric without Notion's trio -->
  <symbol id="logo-lattice" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="0" fill="none"/>
    <path fill="#413cb8" d="M4 4h18v18H4V4zm22 0h18v8H26V4zm0 12h8v18h-8V16zM4 26h8v18H4V26zm12 8h18v10H16V34zm22-8h6v22h-6V26z"/>
  </symbol>

  <!-- D: Arc stack  nested arcs suggesting spacing/type scales -->
  <symbol id="logo-arcs" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="22" fill="#fff"/>
    <path fill="#413cb8" fill-rule="evenodd" d="M24 8c8.84 0 16 7.16 16 16s-7.16 16-16 16S8 32.84 8 24 15.16 8 24 8zm0 5c6.08 0 11 4.92 11 11s-4.92 11-11 11S13 30.08 13 24s4.92-11 11-11zm0 5c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6 2.69-6 6-6zm0 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
  </symbol>

  <!-- E: Y-mark  abstract Y from a sliced disc; wordmark-adjacent without lettering -->
  <symbol id="logo-ymark" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="22" fill="#fff"/>
    <path fill="#413cb8" d="M24 6C14.06 6 6 14.06 6 24s8.06 18 18 18 18-8.06 18-18S33.94 6 24 6zm0 4c7.73 0 14 6.27 14 14 0 2.8-.83 5.4-2.25 7.56L24 24.2 12.25 31.56A13.9 13.9 0 0 1 10 24c0-7.73 6.27-14 14-14zm-2 16.55 8.9 9.7A13.9 13.9 0 0 1 24 38c-2.5 0-4.84-.66-6.88-1.8L22 26.55zm4 0 4.88 9.65c-1.4.76-2.98 1.28-4.68 1.5L26 26.55z"/>
  </symbol>

  <!-- F: Interlock  circle + truncated square sharing a gap (modular, not Notion's three primitives) -->
  <symbol id="logo-interlock" viewBox="0 0 48 48">
    <path fill="#413cb8" d="M8 6h20v14H18v10H8V6zm22 12c8.28 0 15 6.72 15 15s-6.72 15-15 15-15-6.72-15-15h10c0 2.76 2.24 5 5 5s5-2.24 5-5-2.24-5-5-5V18z"/>
  </symbol>
</svg>
