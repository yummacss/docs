# pnpm 11 refuses to finish an install while a dependency's build script is
# neither allowed nor denied, so these have to be real booleans - the scaffold
# it writes leaves them as placeholder strings, which reads as "not allowed"
# and exits 1 before Next.js is ever reached.
allowBuilds:
  esbuild: true
  sharp: true
# Our own packages, so the release-age wait buys nothing. A bare name covers
# every version, so a release needs no new line here.
minimumReleaseAgeExclude:
  - '@yummacss/*'
  - yummacss
  - '@videojs/core@10.0.1'
  - '@videojs/media@10.0.1'
  - '@videojs/native-hls-video@10.0.1'
  - '@videojs/react@10.0.1'
  - '@videojs/spf@10.0.1'
  - '@videojs/store@10.0.1'
  - '@videojs/utils@10.0.1'
  - '@videojs/youtube-video@10.0.1'
