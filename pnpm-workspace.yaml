# pnpm 11 refuses to finish an install while a dependency's build script is
# neither allowed nor denied, so these have to be real booleans - the scaffold
# it writes leaves them as placeholder strings, which reads as "not allowed"
# and exits 1 before Next.js is ever reached.
allowBuilds:
  esbuild: true
  sharp: true
# Our own packages, so the release-age wait buys nothing. pnpm takes exact
# versions only here, no ranges, so every release needs a line.
minimumReleaseAgeExclude:
  - '@yummacss/core@4.0.0 || 4.1.0 || 4.1.1 || 4.1.2'
  - '@yummacss/lint@4.0.0 || 4.1.0 || 4.1.1 || 4.1.2'
  - '@yummacss/nitro@4.0.0 || 4.1.0 || 4.1.1 || 4.1.2'
  - '@yummacss/postcss@4.0.0 || 4.1.0 || 4.1.1 || 4.1.2'
  - yummacss@4.0.0 || 4.1.0 || 4.1.1 || 4.1.2
